<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروفي | سجل مصروفك الشهري (EGP)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --danger: #ef4444;
    --radius: 14px;
    --shadow: 0 4px 16px rgba(31, 41, 55, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  .container {
    max-width: 1100px;

    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  header { margin-bottom: 24px; }
  header h1 { font-size: 1.8rem; }
  header p { color: var(--muted); }

  /* ---------- Summary cards ---------- */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }

  .stat-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .stat-value { font-size: 1.7rem; font-weight: 700; margin-top: 4px; }
  .stat-sub { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }


  /* ---------- Main layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 24px;
    align-items: start;
  }

  .card h2 { font-size: 1.1rem; margin-bottom: 16px; }

  /* ---------- Form ---------- */
  form { display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 0.85rem; font-weight: 600; }

  input, select {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }

  .btn {
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 10px;

    padding: 11px 16px;
    cursor: pointer;
    background: var(--primary);
    color: #fff;
    transition: background 0.2s;
  }
  .btn:hover { background: var(--primary-dark); }

  .error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }

  /* ---------- Chart ---------- */
  .chart-wrap { margin-bottom: 24px; }
  canvas { width: 100%; height: 260px; display: block; }

  /* ---------- List ---------- */
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .list-header h2 { margin-bottom: 0; }

  ul { list-style: none; }

  .expense {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;

    border-bottom: 1px solid var(--border);
  }
  .expense:last-child { border-bottom: none; }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .expense-info { flex: 1; min-width: 0; }
  .expense-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .expense-meta { font-size: 0.8rem; color: var(--muted); }
  .expense-amount { font-weight: 700; }

  .delete-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
  }
  .delete-btn:hover { color: var(--danger); background: #fee2e2; }


  .empty { text-align: center; color: var(--muted); padding: 24px 0; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .summary { grid-template-columns: 1fr; }
  }

/* ---------- Masroufi: ledger look ---------- */
:root{--bg:#f6f1e4;--card:#fffdf6;--text:#23302a;--muted:#6f7a70;--border:#ddd5bf;--primary:#1f6b4a;--primary-dark:#175238;--radius:6px;--shadow:none}
body{font-family:Georgia,"Times New Roman",serif;background:var(--bg) repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,107,74,.07) 31px 32px)}
header{border-bottom:3px double var(--primary);padding-bottom:14px}
header h1{font-size:2.3rem;letter-spacing:.02em;color:var(--primary)}
.card{border:1px solid var(--border);border-top:4px solid var(--primary)}
.summary{grid-template-columns:2fr 1fr 1fr}
.summary .card:first-child{background:var(--primary);color:#fff;border-color:var(--primary-dark)}
.summary .card:first-child .stat-label,.summary .card:first-child .stat-sub{color:#cfe8da}
.stat-value,.expense-amount{font-family:"Courier New",monospace;font-variant-numeric:tabular-nums}
.stat-label{text-transform:none;letter-spacing:0;font-style:italic}
.layout{grid-template-columns:1fr 330px}
.layout>section.card{order:2}
.btn,input,select{border-radius:4px}
.btn{text-transform:uppercase;letter-spacing:.06em;font-size:.85rem}
.expense{border-bottom:1px dashed var(--border)}
@media(max-width:860px){.layout{grid-template-columns:1fr}.layout>section.card{order:0}.summary{grid-template-columns:1fr}}
body[dir=rtl],html[dir=rtl] body{font-family:"Cairo",system-ui,sans-serif}
html[dir=rtl] header h1{font-family:"Cairo",sans-serif;letter-spacing:0}
html[dir=rtl] .btn{letter-spacing:0;text-transform:none;font-size:1rem}
html[dir=rtl] .stat-label{font-style:normal}
html[dir=rtl] .summary .card:first-child{border-color:var(--primary-dark)}
html[dir=rtl] .amt,html[dir=rtl] .stat-value,html[dir=rtl] .expense-amount{direction:ltr;text-align:right;unicode-bidi:isolate}
.lang{position:absolute;top:16px;inset-inline-end:16px;background:none;border:1px solid var(--primary);color:var(--primary);border-radius:4px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.container{position:relative}
</style>
</head>
<body>
<div class="container">
  <button type="button" class="lang" id="langBtn">English</button>

  <header>
    <h1 id="t-title">مصروفي</h1>
    <p id="t-sub">المصروف راح فين الشهر ده؟ سجّله بالجنيه المصري.</p>
  </header>

  <!-- Summary cards -->
  <section class="summary" aria-label="Summary">
    <div class="card">
      <div class="stat-label" id="t-spent">صرفت الشهر ده</div>
      <div class="stat-value" id="statTotal">0.00 EGP</div>
      <div class="stat-sub" id="statMonth"></div>
    </div>
    <div class="card">
      <div class="stat-label" id="t-entries">عدد المصاريف</div>
      <div class="stat-value" id="statCount">0</div>
      <div class="stat-sub" id="t-all">من أول ما بدأت</div>
    </div>
    <div class="card">

      <div class="stat-label" id="t-big">أكبر مصروف</div>
      <div class="stat-value" id="statBiggest">0.00 EGP</div>
      <div class="stat-sub" id="statBiggestName">—</div>
    </div>
  </section>

  <div class="layout">

    <!-- Add expense form -->
    <section class="card">
      <h2 id="t-log">سجّل مصروف</h2>
      <form id="expenseForm" novalidate>
        <label><span id="t-name">الاسم</span>
          <input type="text" id="name" placeholder="مثلاً: غدا كشري" maxlength="60">
        </label>
        <label><span id="t-amount">المبلغ (EGP)</span>
          <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01">
        </label>
        <label><span id="t-cat">النوع</span>
          <select id="category">
            <option value="food" data-cat="food">Food</option>
            <option value="transport" data-cat="transport">Transport</option>
            <option value="shopping" data-cat="shopping">Shopping</option>
            <option value="bills" data-cat="bills">Bills</option>
            <option value="other" data-cat="other">Other</option>
          </select>
        </label>
        <label><span id="t-date">التاريخ</span>
          <input type="date" id="date">
        </label>
        <div class="error" id="formError" role="alert"></div>
        <button type="submit" class="btn" id="t-add">أضف المصروف</button>

      </form>
    </section>

    <div>
      <!-- Bar chart -->
      <section class="card chart-wrap">
        <h2 id="t-where">راح فين</h2>
        <canvas id="chart"></canvas>
      </section>

      <!-- Expense list with filter -->
      <section class="card">
        <div class="list-header">
          <h2 id="t-hist">السجل</h2>
          <select id="filter" aria-label="Filter by category">
            <option value="all">كل الأنواع</option>
            <option value="food" data-cat="food">Food</option>
            <option value="transport" data-cat="transport">Transport</option>
            <option value="shopping" data-cat="shopping">Shopping</option>
            <option value="bills" data-cat="bills">Bills</option>
            <option value="other" data-cat="other">Other</option>
          </select>
        </div>
        <ul id="list"></ul>
      </section>
    </div>

  </div>
</div>

<script>
/* ==========================================================

   1. CONFIG & STATE
   ========================================================== */
const STORAGE_KEY = "expense-tracker-data";

// Each category has a label and a color (used in the chart and list dots)
const CATEGORIES = {
  food:      { label: "أكل",      color: "#f59e0b" },
  transport: { label: "مواصلات", color: "#3b82f6" },
  shopping:  { label: "شوبينج",  color: "#ec4899" },
  bills:     { label: "فواتير",     color: "#10b981" },
  other:     { label: "حاجات تانية",     color: "#8b5cf6" }
};
const I18N = {
  ar: {
    cats: { food: "أكل", transport: "مواصلات", shopping: "شوبينج", bills: "فواتير", other: "حاجات تانية" },
    locale: "ar-EG", title: "مصروفي | سجل مصروفك الشهري (EGP)", btn: "English",
    ids: { "t-title": "مصروفي", "t-sub": "المصروف راح فين الشهر ده؟ سجّله بالجنيه المصري.", "t-spent": "صرفت الشهر ده", "t-entries": "عدد المصاريف", "t-all": "من أول ما بدأت", "t-big": "أكبر مصروف", "t-log": "سجّل مصروف", "t-name": "الاسم", "t-amount": "المبلغ (EGP)", "t-cat": "النوع", "t-date": "التاريخ", "t-add": "أضف المصروف", "t-where": "راح فين", "t-hist": "السجل" },
    placeholder: "مثلاً: غدا كشري", all: "كل الأنواع", filterLabel: "فلتر حسب النوع", del: "امسح المصروف",
    empty: "مفيش مصاريف لسه.", errName: "اكتب اسم المصروف.", errAmount: "المبلغ لازم يكون أكبر من صفر.", errDate: "اختار التاريخ."
  },
  en: {
    cats: { food: "Food", transport: "Transport", shopping: "Shopping", bills: "Bills", other: "Other" },
    locale: "en-US", title: "Masroufi | Monthly Spending Log (EGP)", btn: "عربي",
    ids: { "t-title": "Masroufi", "t-sub": "Where did this month's pocket money go? Log it in Egyptian pounds.", "t-spent": "Spent this month", "t-entries": "Entries logged", "t-all": "All time", "t-big": "Biggest expense", "t-log": "Log a spend", "t-name": "Name", "t-amount": "Amount (EGP)", "t-cat": "Category", "t-date": "Date", "t-add": "Add expense", "t-where": "Where it went", "t-hist": "History" },
    placeholder: "e.g. Koshary lunch", all: "All categories", filterLabel: "Filter by category", del: "Delete expense",
    empty: "No expenses to show yet.", errName: "Please enter a name.", errAmount: "Amount must be greater than 0.", errDate: "Please pick a date."
  }
};
let lang = localStorage.getItem("masroufi-lang") === "en" ? "en" : "ar";
const T = () => I18N[lang];

// The single source of truth: an array of expense objects
// { id, name, amount, category, date }
let expenses = loadExpenses();

/* ==========================================================
   2. DOM REFERENCES
   ========================================================== */
const form        = document.getElementById("expenseForm");
const nameInput   = document.getElementById("name");
const amountInput = document.getElementById("amount");
const catInput    = document.getElementById("category");
const dateInput   = document.getElementById("date");
const formError   = document.getElementById("formError");
const filterSel   = document.getElementById("filter");
const listEl      = document.getElementById("list");
const canvas      = document.getElementById("chart");

/* ==========================================================
   3. LOCAL STORAGE HELPERS

   ========================================================== */
function loadExpenses() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(data) ? data : [];
  } catch (err) {
    // If the stored data is corrupted, start fresh instead of crashing
    return [];
  }
}

function saveExpenses() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
}

/* ==========================================================
   4. SMALL UTILITIES
   ========================================================== */
// Format a number as currency, e.g. 12.5 -> "12.50 EGP"
function formatMoney(n) {
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " EGP";
}

// Today's date as "YYYY-MM-DD" (using local time, not UTC)
function todayString() {
  const d = new Date();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${month}-${day}`;
}

// Show a stored "YYYY-MM-DD" date in a friendly way

function formatDate(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(T().locale, {
    month: "short", day: "numeric", year: "numeric"
  });
}

/* ==========================================================
   5. ADD & DELETE EXPENSES
   ========================================================== */
form.addEventListener("submit", (event) => {
  event.preventDefault(); // stop the page from reloading

  const name = nameInput.value.trim();
  const amount = parseFloat(amountInput.value);
  const date = dateInput.value;

  // Simple validation
  if (!name) return showError(T().errName);
  if (!amount || amount <= 0) return showError(T().errAmount);
  if (!date) return showError(T().errDate);

  expenses.push({
    id: Date.now(),           // unique enough for a small app
    name,
    amount,
    category: catInput.value,
    date
  });

  saveExpenses();
  showError("");

  nameInput.value = "";
  amountInput.value = "";
  nameInput.focus();
  render();
});

function showError(message) {
  formError.textContent = message;
}

function deleteExpense(id) {
  expenses = expenses.filter((e) => e.id !== id);
  saveExpenses();
  render();
}

// Event delegation: one listener on the <ul> handles every delete button
listEl.addEventListener("click", (event) => {
  const btn = event.target.closest(".delete-btn");
  if (btn) deleteExpense(Number(btn.dataset.id));
});

/* ==========================================================
   6. FILTERING
   ========================================================== */
filterSel.addEventListener("change", renderList);

function getFilteredExpenses() {
  const selected = filterSel.value;
  const filtered = selected === "all"
    ? expenses
    : expenses.filter((e) => e.category === selected);


  // Newest first (copy the array so we don't reorder the original)
  return [...filtered].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
}

/* ==========================================================
   7. RENDER THE EXPENSE LIST
   ========================================================== */
function renderList() {
  const items = getFilteredExpenses();

  if (items.length === 0) {
    listEl.innerHTML = `<li class="empty">${T().empty}</li>`;
    return;
  }

  // Build the HTML for each expense.
  // We use textContent below for names to avoid injecting raw HTML (XSS safety).
  listEl.innerHTML = "";
  items.forEach((e) => {
    const li = document.createElement("li");
    li.className = "expense";
    li.innerHTML = `
      <span class="dot" style="background:${CATEGORIES[e.category].color}"></span>
      <div class="expense-info">
        <div class="expense-name"></div>
        <div class="expense-meta">${T().cats[e.category]} · ${formatDate(e.date)}</div>
      </div>
      <div class="expense-amount">${formatMoney(e.amount)}</div>
      <button class="delete-btn" data-id="${e.id}" aria-label="${T().del}">✕</button>
    `;
    li.querySelector(".expense-name").textContent = e.name;

    listEl.appendChild(li);
  });
}

/* ==========================================================
   8. SUMMARY CARDS
   ========================================================== */
function renderSummary() {
  const now = new Date();
  const prefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

  // Total for the current month only (dates start with "YYYY-MM")
  const monthTotal = expenses
    .filter((e) => e.date.startsWith(prefix))
    .reduce((sum, e) => sum + e.amount, 0);

  // Biggest expense overall
  const biggest = expenses.reduce(
    (max, e) => (e.amount > max.amount ? e : max),
    { amount: 0, name: "—" }
  );

  document.getElementById("statTotal").textContent = formatMoney(monthTotal);
  document.getElementById("statMonth").textContent =
    now.toLocaleDateString(T().locale, { month: "long", year: "numeric" });
  document.getElementById("statCount").textContent = expenses.length;
  document.getElementById("statBiggest").textContent = formatMoney(biggest.amount);
  document.getElementById("statBiggestName").textContent = biggest.name;
}

/* ==========================================================
   9. BAR CHART (drawn manually on <canvas>)

   ========================================================== */
function renderChart() {
  const ctx = canvas.getContext("2d");

  // Make the canvas sharp on high-DPI screens
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  // Total spending per category
  const keys = Object.keys(CATEGORIES);
  const totals = keys.map((key) =>
    expenses.filter((e) => e.category === key).reduce((s, e) => s + e.amount, 0)
  );
  const maxValue = Math.max(...totals, 1); // avoid dividing by zero

  // Chart area (leave room for labels)
  const pad = { top: 24, right: 12, bottom: 32, left: 12 };
  const chartH = height - pad.top - pad.bottom;
  const chartW = width - pad.left - pad.right;
  const slot = chartW / keys.length;       // horizontal space per bar
  const barW = Math.min(slot * 0.6, 70);   // bar width

  ctx.font = "12px Cairo, system-ui, sans-serif";
  ctx.textAlign = "center";

  // Baseline
  ctx.strokeStyle = "#e5e7eb";

  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top + chartH);
  ctx.lineTo(width - pad.right, pad.top + chartH);
  ctx.stroke();

  keys.forEach((key, i) => {
    const barH = (totals[i] / maxValue) * chartH;
    const x = pad.left + slot * i + (slot - barW) / 2;
    const y = pad.top + chartH - barH;

    // Bar
    ctx.fillStyle = CATEGORIES[key].color;
    ctx.beginPath();
    ctx.roundRect(x, y, barW, Math.max(barH, 2), 6);
    ctx.fill();

    // Amount above the bar
    ctx.fillStyle = "#1f2937";
    ctx.fillText(totals[i] > 0 ? formatMoney(totals[i]) : "", x + barW / 2, y - 6);

    // Category label below the bar
    ctx.fillStyle = "#6b7280";
    ctx.fillText(T().cats[key], x + barW / 2, height - 10);
  });
}

// Redraw the chart when the window size changes (responsive canvas)
window.addEventListener("resize", renderChart);

/* ==========================================================
   10. MAIN RENDER + INITIAL SETUP
   ========================================================== */

function render() {
  renderSummary();
  renderChart();
  renderList();
}

function applyLang() {
  const t = T();
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t.title;
  for (const id in t.ids) document.getElementById(id).textContent = t.ids[id];
  nameInput.placeholder = t.placeholder;
  filterSel.setAttribute("aria-label", t.filterLabel);
  filterSel.querySelector('option[value="all"]').textContent = t.all;
  document.querySelectorAll("option[data-cat]").forEach((o) => { o.textContent = t.cats[o.dataset.cat]; });
  document.getElementById("langBtn").textContent = t.btn;
  render();
}
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  localStorage.setItem("masroufi-lang", lang);
  applyLang();
});

dateInput.value = todayString(); // default the date field to today
applyLang();
</script>
</body>
</html>
